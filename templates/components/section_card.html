<details class="section-card section-card-{{ tone }}"{% if open %} open{% endif %}>
  <summary class="section-card-summary"><h2 class="section-card-title" id="{{ heading_id }}">{{ title }}</h2><span class="section-card-chevron" aria-hidden="true"></span></summary>
  <div class="section-card-body{% if body_class %} {{ body_class }}{% endif %}">{{ content }}</div>
</details>

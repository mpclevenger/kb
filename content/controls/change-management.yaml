# Controls and risks for one topic. Plain text; edit with any text editor.
# After editing: python manage.py check_controls, then
# python manage.py sync_controls --user <you> --publish. See README.md in this folder.
# Each control and risk has an id from the RCM. The site finds items by that id.
#
# FILE
#   topic          Name of the topic exactly as it appears on the site.
#   risks          What could go wrong. Each risk lists the controls that cover it.
#   controls       The controls themselves.
#
# RISK (each entry under "risks")
#   id             The risk's ID from the RCM, for example R-MC-01. Required and unique.
#   title          Short name of the risk.
#   statement      What could go wrong, why, and what it would lead to.
#   owned_by       Role accountable for the risk (a role, not a name).
#   stage          Lifecycle stage the risk belongs to. Use "theme" instead to
#                  place it under a theme. Never both.
#   in_sox_scope   yes or no. Is this a risk for SOX in-scope apps?
#   covered_by     Controls that reduce this risk. Each has:
#                    control   the id of the control (it can be in any topic's file)
#                    coverage  full or partial
#                    why       one line saying how the control helps
#
# CONTROL (each entry under "controls")
#   id             The control's ID from the RCM, for example MC-01. Required and unique.
#                  The site shows this ID and finds the control by it, so a title can change.
#   title          Name of the control.
#   why            Why the control exists, in two or three sentences.
#   applies_when   Plain statements. The control applies if any one is true.
#   nature         preventive (stops it happening) or detective (finds it afterward).
#   method         manual, automated, or it_dependent (a person works from a system report).
#   frequency      event (each time it happens), daily, weekly, monthly, quarterly,
#                  semiannual or annual.
#   level          key, non-key, compensating or supporting, most important first (see levels.yaml):
#                    key           relied on to address the risk, tested by auditors
#                    non-key       matters, but is not relied on alone
#                    compensating  covers for a control that is missing or not working, usually for a limited time
#                    supporting    helps other controls work (documentation, baselines, tuning)
#   owned_by       Role accountable for the control.
#   performed_by   Role that does the work day to day.
#   reviewed_by    Role that checks the work (optional).
#   stage / theme  Where it sits in the topic: one stage, or one theme.
#   categories     Kinds of technology it applies to: application, database,
#                  operating_system, jobs, network, identity, cloud,
#                  engineering_tools or logging.
#   platforms      Optional. Platform names exactly as on the site. A name the
#                  site doesn't have is skipped with a warning.
#   criteria       What good looks like, in groups. Each group has:
#                    heading   what the group is about
#                    part      optional: configuration (set up correctly) or
#                              monitoring (checked on an ongoing basis)
#                    items     plain sentences. Write "text:" and "sox_only: true"
#                              for an item needed only for SOX in-scope apps.
#   steps          How to run it, in order. Each has:
#                    who       role doing the step
#                    do        what to do
#                    evidence  what to keep as proof
#                    part      optional: configuration or monitoring
#   references     Optional. A list of "label" and "link" (starting with https://).

topic: Change management

risks:
  - id: R-MC-01
    title: Unreviewed or unauthorized changes reach production
    statement: >-
      A change reaches production code, configuration or data without being reviewed and approved by
      someone other than its author. This can happen when review is optional, can be bypassed, or is
      not reset when the change is edited. The result could be an error or a deliberate wrong change
      affecting financial data, system behavior or security, found only after customers or reports are
      affected.
    owned_by: Application owner
    stage: Build and review
    in_sox_scope: yes
    covered_by:
      - control: MC-01
        coverage: full
        why: A person other than the author, and other than the last person to push, must approve every change before it can be merged.
      - control: MC-04
        coverage: partial
        why: Required checks and approvals are enforced again at the moment of release.
      - control: MC-07
        coverage: partial
        why: Each change traces to a recorded request, so the reviewer can see what it was meant to do.
      - control: MC-06
        coverage: partial
        why: Finds, after the fact, any production change that has no approval behind it.

  - id: R-MC-02
    title: Changes bypass the pipeline
    statement: >-
      A change reaches production without going through the pipeline, for example on a server, in a
      database or in a cloud console. This can happen when people hold standing write access to
      production or emergency access is not controlled. The result could be an untested, unapproved
      change that leaves no record for anyone checking later.
    owned_by: Application owner
    stage: Release
    in_sox_scope: yes
    covered_by:
      - control: MC-02
        coverage: full
        why: Nobody holds standing write access to production for day-to-day work, so the pipeline is the normal way in, and who can write is checked on a schedule.
      - control: MC-05
        coverage: partial
        why: Covers the rare cases where access is opened up, by requiring a reason and a review afterward.
      - control: MC-06
        coverage: partial
        why: Compares the full list of production deployments to approved changes, so a bypass shows up as unmatched.

  - id: R-MC-03
    title: The pipeline itself is changed to skip controls
    statement: >-
      The pipeline, its protection rules or its secrets are changed so that review, tests or approvals
      no longer apply. This can happen when pipeline files and settings have no named owners or their
      changes are not reviewed and logged. The result could be that every later change looks
      controlled when it is not.
    owned_by: Engineering manager
    stage: Build and review
    in_sox_scope: yes
    covered_by:
      - control: MC-03
        coverage: full
        why: Pipeline definitions, environments, rules and secrets can only change through review by named owners, and someone outside that group reviews the change log.
      - control: MC-01
        coverage: partial
        why: Pipeline files are code, so changes to them need an independent approval too.
      - control: MC-04
        coverage: partial
        why: Checks that can't be skipped limit what a changed pipeline can get away with.

  - id: R-MC-04
    title: Emergency changes are not reviewed
    statement: >-
      An emergency change reaches production and is never reviewed afterward. This can happen when the
      emergency path has no recorded reason or no follow-up review. The result could be a wrong or
      unauthorized change staying in production unnoticed.
    owned_by: Application owner
    stage: Release
    in_sox_scope: yes
    covered_by:
      - control: MC-05
        coverage: full
        why: Every emergency change has a recorded reason and is reviewed and approved after the fact.
      - control: MC-02
        coverage: partial
        why: Emergency access to production is time-limited, logged and reviewed.

  - id: R-MC-05
    title: Production changes can't be completely listed or traced to approvals
    statement: >-
      The production changes for a period can't be completely listed or traced to their approvals.
      This can happen when the change list is built by hand or isn't matched to approvals regularly.
      The result could be unauthorized changes to financial data or systems going unnoticed, because
      nothing shows they happened.
    owned_by: Application owner
    stage: Monitor
    in_sox_scope: yes
    covered_by:
      - control: MC-06
        coverage: full
        why: A complete system-generated list is matched to approved changes every period.
      - control: MC-02
        coverage: partial
        why: Funnels deployments through one place, so the list can be complete.
      - control: MC-07
        coverage: partial
        why: Request numbers carried into the pull request and deployment let each change be traced back.

  - id: R-MC-06
    title: Changes are made without a recorded request or approval
    statement: >-
      A change is made to production code, configuration or data that nobody with authority asked for
      or agreed to. This can happen when work starts from a conversation, or when requests are not
      recorded or approved before release. The result could be unplanned changes affecting financial
      data or systems, with no record of why they were made or who agreed to them.
    owned_by: Application owner
    stage: Request and approve
    in_sox_scope: yes
    covered_by:
      - control: MC-07
        coverage: full
        why: Every change starts from a recorded request that an authorized person, not the requester or builder, approves before release.
      - control: MC-06
        coverage: partial
        why: Finds production changes that cannot be matched to a request.

  - id: R-MC-07
    title: Untested changes break systems or financial data
    statement: >-
      A change goes live without being tested properly, or without the people who rely on it agreeing
      that it works. This can happen when tests are skipped, run in production, or their results are
      not kept. The result could be wrong figures, failed jobs or an outage that is found only after
      people are affected.
    owned_by: Application owner
    stage: Test
    in_sox_scope: yes
    covered_by:
      - control: MC-08
        coverage: full
        why: Changes are tested outside production, failures stop the release, and users accept results where figures or reports are affected.
      - control: MC-04
        coverage: partial
        why: The pipeline enforces that required checks passed at the moment of release.

  - id: R-MC-08
    title: Direct changes to production databases go undetected
    statement: >-
      Data or structure in a production database is changed outside the pipeline, for example by an
      administrator running a statement, and nobody notices. This can happen when database auditing does
      not capture data and structure changes, or the audit records are never compared with approved
      requests. The result could be financial data or tables altered with no approval and no record of
      why.
    owned_by: Head of Engineering
    theme: Direct database changes
    in_sox_scope: yes
    covered_by:
      - control: MC-09
        coverage: full
        why: Changes found in the database audit records are matched to approved requests, and unmatched ones are investigated.
      - control: MC-02
        coverage: partial
        why: Removes standing write access for day-to-day work, so far fewer direct changes are possible.
      - control: MC-05
        coverage: partial
        why: A direct change made in an emergency has a recorded reason and a review afterward.

controls:
  - id: MC-01
    title: Peer-reviewed changes
    why: >-
      A second person catches mistakes and stops one person from putting an unchecked change into
      production. The tool, not good intentions, makes sure it happens.
    applies_when:
      - The team changes code, configuration, infrastructure as code or database schema that runs in production.
    nature: preventive
    method: automated
    frequency: event
    level: key
    owned_by: Engineering manager
    performed_by: Developer
    reviewed_by: Peer reviewer
    stage: Build and review
    categories: [application, database, engineering_tools, cloud]
    criteria:
      - heading: What is reviewed
        items:
          - Every change to production code, configuration, infrastructure as code and database schema reaches the main branch only through a pull request approved by someone other than the author, before it is deployed.
          - The reviewer looks at the whole change, not only the part the author points to.
      - heading: Branch protection
        part: configuration
        items:
          - Branch protection or a ruleset requires at least one approval from someone other than the author, requires the most recent push to be approved by someone other than the person who pushed it, drops approvals when new commits are pushed, and blocks pushing straight to the protected branch.
          - There is no bypass for in-scope repositories, including for administrators. Where bypass can't be removed, it is limited to a small named group, and every use is logged and reviewed.
          - The settings are shown to hold for the whole period by a dated export when they are set up, plus the audit log of changes to them for the rest of the period.
      - heading: Staying protected
        part: monitoring
        items:
          - On the schedule set in your team's written procedure, someone checks that branch protection still matches the intended settings on every repository that holds production changes. Any gap is fixed and the cause recorded.
          - text: The settings evidence, the checks and their results are kept for the period in the firm's [records retention schedule](#todo-records-retention-schedule).
            sox_only: true
    steps:
      - who: Repository administrator
        do: Turn on branch protection or a ruleset for the main branch of each repository that holds production changes, with the settings listed above.
        evidence: A dated export of the protection settings, and the audit log of changes to them for the rest of the period
        part: configuration
      - who: Developer
        do: Open a pull request for every change and describe what it does and why.
        evidence: The pull request
      - who: Peer reviewer
        do: Review the whole change and approve it, or ask for changes.
        evidence: The recorded approval, showing the reviewer and the commit approved
      - who: Control owner
        do: On the schedule set in your procedure, list the protection settings of every in-scope repository and compare them to the intended settings.
        evidence: The list with the date, and tickets for any fixes
        part: monitoring

  - id: MC-02
    title: Production changes only through the pipeline
    why: >-
      If people can change production by hand, the review and testing steps can be skipped without
      anyone noticing. Letting only the pipeline deploy keeps every change on the record.
    applies_when:
      - People or tools can change production code, configuration, infrastructure or database objects.
    nature: preventive
    method: automated
    frequency: event
    level: key
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    stage: Release
    categories: [application, database, engineering_tools, cloud]
    criteria:
      - heading: No standing access
        items:
          - Nobody has standing write access to production code, configuration, infrastructure or data for day-to-day work, and the pipeline's service identity is the one that deploys. Administrators who need write access for platform support are named, use separate admin accounts, and their changes are logged and reviewed under the privileged access control.
          - People can't read or reuse the pipeline's credentials to sign in as themselves.
          - Development and test environments are separate from production, with separate access, so developers do not need production access to do their work.
      - heading: Direct database changes
        items:
          - Changes to database structure or data are made by the pipeline. Where a direct change can't be blocked, it is logged and reviewed as in "Direct database changes are reviewed".
      - heading: Break-glass access
        items:
          - Break-glass access is given for a stated reason and a limited time, and ends on its own. Every use is logged, and someone other than the user reviews what was done.
      - heading: Staying limited
        part: monitoring
        items:
          - On the schedule set in your team's written procedure, the people and groups with write access to production are exported and compared with the expected list (the pipeline identity, the break-glass group and named administrators). Anything else is removed and the cause recorded.
          - text: The lists of who held write access to production and the comparisons are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Platform engineer
        do: Remove standing write access to production from people and groups, leaving the pipeline's service identity, the break-glass group and named administrators.
        evidence: A dated export of who can write to production
      - who: Database administrator
        do: Block direct changes by people, or turn on auditing for any that remain.
        evidence: A dated export of the setting or the audit configuration
      - who: Platform engineer
        do: Grant break-glass access only against a recorded reason, with an end time.
        evidence: The request, the grant and the end time
      - who: Reviewer
        do: Review each break-glass session afterward and compare what was done to the stated reason.
        evidence: Signed-off review linked to the session log
      - who: Control owner
        do: On the schedule set in your procedure, export who can write to production, compare it with the expected list, and remove anything else.
        evidence: The dated export, the comparison and tickets for removals
        part: monitoring

  - id: MC-03
    title: Pipeline configuration is protected
    why: >-
      The pipeline enforces most of the other change controls. If someone can quietly edit it, they
      can switch those controls off, so the pipeline needs the same protection as production code.
    applies_when:
      - The team uses an automated pipeline to build, test or deploy production changes.
    nature: preventive
    method: automated
    frequency: event
    level: key
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Code owner
    stage: Build and review
    categories: [application, engineering_tools, cloud]
    criteria:
      - heading: Who can change it
        items:
          - Pipeline definitions, such as workflow files, can only be changed through a reviewed pull request.
          - Named owners, for example code owners, must approve any change to those files.
          - Deployment environments, protection rules and secrets can only be changed by a small, named group.
      - heading: Visibility
        items:
          - Changes to pipeline definitions, environments, protection rules and secrets are logged.
          - Someone outside the group that can change these settings reviews the log entries on the schedule set in your team's written procedure, and unexpected changes are investigated.
          - text: The named owners, the log entries and the reviews are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Repository administrator
        do: Add the pipeline files to the code owners list and require owner approval for them.
        evidence: The code owners file, and a dated export of the protection setting with its change history
        part: configuration
      - who: Platform engineer
        do: Limit who can edit environments, protection rules and secrets to the named group.
        evidence: A dated export of the group and its permissions, and the audit log of changes to them for the rest of the period
        part: configuration
      - who: Control owner
        do: As someone outside the group that can change these settings, review the log of changes to pipeline settings and match each one to a reviewed pull request or a request.
        evidence: The log extract with notes on each item, showing the reviewer and the date
        part: monitoring

  - id: MC-04
    title: Production deployment approval and test gates
    why: >-
      A change that passed review can still fail in production if tests are skipped or the wrong
      person releases it. Gates at the point of release make the last check automatic.
    applies_when:
      - The team deploys changes to production.
    nature: preventive
    method: it_dependent
    frequency: event
    level: non-key
    owned_by: Application owner
    performed_by: Release approver
    reviewed_by: Control owner
    stage: Release
    categories: [application, database, cloud]
    criteria:
      - heading: Required checks
        items:
          - Deployment to production starts only when the required checks, such as build and tests, have passed. The list is set in the pipeline, not chosen by the person releasing, and a check can't be skipped or overridden for one release, including by administrators (environment protection rules don't allow administrator bypass).
          - A way back is known before the release starts.
          - The deployment record links back to the commit and the request it came from.
      - heading: Approval
        items:
          - Where the risk of the change calls for it, a named approver other than the author approves the deployment, and the approval is recorded against the version being deployed.
          - text: Approver lists and check results are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Platform engineer
        do: Set the required checks and the named approvers on the production environment, with administrator bypass turned off.
        evidence: A dated export of the environment protection rules, and the audit log of changes to them for the rest of the period
        part: configuration
      - who: Release approver
        do: Confirm the checks passed and the change matches what was approved, then approve the deployment.
        evidence: The recorded approval linked to the deployment
      - who: Control owner
        do: Look at a set number of releases chosen from across the period (your procedure says how many and how they are chosen), and confirm each had passing checks and, where needed, an approval from someone other than the author.
        evidence: The releases reviewed, how they were chosen, and notes
        part: monitoring

  - id: MC-05
    title: Emergency changes are recorded and reviewed afterward
    why: >-
      Real emergencies need a faster path. That path is a gap in the normal controls, so it has to
      be rare, explained when used, and checked afterward.
    applies_when:
      - A change must reach production faster than the normal approval path allows.
    nature: detective
    method: manual
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Change requester
    reviewed_by: Change approver
    stage: Release
    categories: [application, database, engineering_tools, cloud]
    criteria:
      - heading: Using the emergency path
        items:
          - A documented emergency path exists, and the team knows what counts as an emergency. Missed deadlines and convenience do not.
          - Each use has a recorded reason, a requester and a date and time.
          - Any extra access opened for the emergency ends after a set time and the end is recorded. A way back is ready before the change is made.
          - How often the emergency path is used is reported to management, because a steady stream means the normal path needs fixing.
      - heading: Review afterward
        items:
          - Every emergency change is reviewed and approved after the fact by someone other than the person who made it, within the time set in your team's written procedure.
          - The review confirms what changed, that it matched the reason given, and that any skipped steps were completed. Follow-up work, such as tests or a normal pull request, is tracked to completion.
          - text: The list of emergency changes and their reviews is kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Change requester
        do: Record the reason, what will change and who approved the emergency path.
        evidence: The emergency change record
      - who: Change requester
        do: Make the change and link it to the record.
        evidence: The deployment or change log entry
      - who: Change approver
        do: Within the time set in your procedure, review the change against the record, approve or reject it, and note any follow-up.
        evidence: The signed-off review
      - who: Control owner
        do: Check that every emergency change in the period has a completed review.
        evidence: The list of emergency changes with review dates
        part: monitoring

  - id: MC-06
    title: Production change reconciliation
    why: >-
      Preventive controls can fail without anyone noticing. Comparing everything that actually
      reached production to what was approved shows whether they worked. It also gives auditors
      the complete list to choose samples from.
    applies_when:
      - Changes are deployed to production.
    nature: detective
    method: it_dependent
    frequency: monthly
    level: key
    owned_by: Head of Engineering
    performed_by: Release manager
    reviewed_by: Control owner
    stage: Monitor
    categories: [application, database, engineering_tools, cloud]
    criteria:
      - heading: The list of deployments
        items:
          - The list of production deployments for the period is produced by a system, not typed or edited by hand.
          - The list covers every deployment path for the whole period, including database and configuration changes, job definitions, system software and server settings, not only application code.
          - The person running the control confirms the list is complete, for example by checking it against a second source.
      - heading: The match
        items:
          - Each deployment is matched to an approved change, such as a request with a pull request, or an emergency change record with its completed review afterward. Anything unmatched is investigated and the outcome recorded.
          - A different person reviews the reconciliation and the follow-up.
          - A short summary of volumes, emergency use and unmatched items goes to management on the schedule set in your team's written procedure.
          - text: The list, the matching and the review are kept for the period in the firm's records retention schedule, and can be given to auditors as the complete list they choose samples from, along with the query and completeness check that show how it was produced.
            sox_only: true
    steps:
      - who: Release manager
        do: Pull the list of all production deployments for the period from the pipeline and from the production systems.
        evidence: The exports, with the date and the period they cover
      - who: Release manager
        do: Match each deployment to an approved change and mark anything with no match.
        evidence: The matched list
      - who: Release manager
        do: Investigate each unmatched item and record whether it was authorized, with the evidence.
        evidence: Tickets or notes for each item
      - who: Control owner
        do: Review the matched list and the follow-up, and sign off.
        evidence: The sign-off with the date

  - id: MC-07
    title: Changes start from an approved request
    why: >-
      Every production change should trace back to someone with authority asking for it and agreeing
      to it. A recorded request, approved by a person other than the one building the change, keeps
      work from starting on a conversation and gives every later step something to point back to.
    applies_when:
      - The team changes code, configuration, infrastructure, jobs or data that runs in production.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Change requester
    reviewed_by: Change approver
    stage: Request and approve
    categories: [application, database, engineering_tools, cloud]
    criteria:
      - heading: The request
        items:
          - Every change starts with a recorded request that says what is changing, why and which systems it touches, kept in one system that records who asked and when.
          - The size of the risk (impact and urgency) is noted, and it decides how much approval, review and testing the change needs.
          - The request number is carried into the pull request and the deployment, so each deployment traces back to its request.
      - heading: Approval
        items:
          - An authorized person, such as the system owner or a named delegate, approves the request before the change is released.
          - The approver is not the requester and not the person building the change.
          - The system records who approved and when, and a change to the request after approval needs approval again.
          - text: The requests and their approvals are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Change requester
        do: Raise a request that says what will change, why and which systems are touched, and note the risk.
        evidence: The request record
      - who: Change approver
        do: Confirm the change is wanted and sized correctly, then approve or decline.
        evidence: The recorded approval, showing the approver and the time
      - who: Developer
        do: Carry the request number into the pull request and the deployment.
        evidence: The pull request and deployment showing the request number

  - id: MC-08
    title: Changes are tested and accepted before release
    why: >-
      A change can be reviewed and approved and still be wrong. Testing outside production, and
      having the people who rely on the result accept it, finds problems while they are cheap to fix and
      keeps broken changes away from financial data.
    applies_when:
      - The team changes code, configuration, jobs, reports or data conversions that run in production.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Tester
    reviewed_by: Change approver
    stage: Test
    categories: [application, database, engineering_tools, cloud]
    criteria:
      - heading: Testing
        items:
          - Changes are tested outside production, in an environment kept separate from it.
          - What was tested and the result, pass or fail, are kept with the change. Automated test results count.
          - A failed test stops the release, and the fix is tested again.
      - heading: Acceptance
        items:
          - Where a change affects financial data, reports or what users see, the business owner or a user accepts the test results before release.
          - For data conversions and migrations, results are checked against the source, for example by comparing counts and totals, before go-live.
          - text: The test results and acceptances are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Tester
        do: Test the change in a non-production environment and record what was tested and the result.
        evidence: The test results, linked to the change
      - who: Business owner
        do: Where figures, reports or user-facing behavior change, review the results and accept or reject them.
        evidence: The recorded acceptance
      - who: Tester
        do: For a conversion or migration, compare the new data to the source before go-live.
        evidence: The comparison with counts and totals

  - id: MC-09
    title: Direct database changes are reviewed
    why: >-
      Even with access tightly limited, administrators and break-glass accounts can still change data or
      structure by hand. The database's own audit records show what changed and who changed it, so
      comparing them with approved requests finds the changes nobody agreed to.
    applies_when:
      - People or accounts other than the pipeline can change data or structure in a production database.
    nature: detective
    method: it_dependent
    frequency: monthly
    level: key
    owned_by: Head of Engineering
    performed_by: Reviewer
    reviewed_by: Control owner
    theme: Direct database changes
    categories: [database, cloud]
    criteria:
      - heading: Seeing the changes
        part: configuration
        items:
          - Database auditing records changes to data (inserts, updates and deletes on in-scope tables) and to structure (create, alter and drop) made by anyone other than the pipeline's identity, with who, what, when and the object affected.
          - The audit records are collected centrally, the people they record can't change them, and a stopped feed raises an alert, as in "Log feeds are actively monitored and a stopped feed is fixed".
      - heading: Matching to requests
        part: monitoring
        items:
          - On the schedule set in your team's written procedure, a system-generated list of direct changes for the period is produced from the audit records. Accounts left out, such as the pipeline identity, are named with the reason, and the list is checked for completeness (see [Reports used in controls](/guides/can-you-trust-the-report/)).
          - Each change is matched to an approved request, such as a data fix ticket or a break-glass record, that covers what was changed.
          - Anything unmatched, or beyond what the request approved, is investigated and the outcome recorded. Unauthorized changes are corrected and reported to the system owner.
          - The reviewer is not one of the administrators whose changes are in the records. Where that can't be avoided, someone else reviews the reviewer's own entries.
          - text: The list, the matching and the follow-up are kept for the period in the firm's records retention schedule, and can be given to auditors as the complete list they choose samples from.
            sox_only: true
    steps:
      - who: Database administrator
        do: Turn on auditing of data and structure changes for the in-scope databases and send the records to the central logging system.
        evidence: The audit configuration and a sample record, with the date
        part: configuration
      - who: Reviewer
        do: On the schedule set in your procedure, produce the list of direct changes from the audit records, leaving out the pipeline identity, and check that it is complete.
        evidence: The list with the date and period, the query used and the completeness check
        part: monitoring
      - who: Reviewer
        do: Match each change to an approved request and investigate each one that has none or goes beyond it.
        evidence: The matched list, with tickets or notes for each unmatched item
        part: monitoring
      - who: Control owner
        do: Review the matching and the follow-up, and sign off.
        evidence: The sign-off with the date
        part: monitoring

# Controls and risks for one topic. Plain text; edit with any text editor.
# After editing: python manage.py check_controls, then
# python manage.py sync_controls --user <you> --publish. See README.md in this folder.
# A control or risk is matched to the site by its title. Renaming a title makes a NEW item.
#
# FILE
#   topic          Name of the topic exactly as it appears on the site.
#   risks          What could go wrong. Each risk lists the controls that cover it.
#   controls       The controls themselves.
#
# RISK (each entry under "risks")
#   title          Short name of the risk.
#   statement      What could go wrong, why, and what it would lead to.
#   owned_by       Role accountable for the risk (a role, not a name).
#   stage          Lifecycle stage the risk belongs to. Use "theme" instead to
#                  place it under a theme. Never both.
#   in_sox_scope   yes or no. Is this a risk for SOX in-scope apps?
#   covered_by     Controls that reduce this risk. Each has:
#                    control   the short name ("ref") of a control in this file
#                    coverage  full or partial
#                    why       one line saying how the control helps
#
# CONTROL (each entry under "controls")
#   ref            Short name used only inside this file, so risks can point to it.
#                  The site gives the control its real ID (for example MC-01).
#   title          Name of the control.
#   why            Why the control exists, in two or three sentences.
#   applies_when   Plain statements. The control applies if any one is true.
#   nature         preventive (stops it happening) or detective (finds it afterward).
#   method         manual, automated, or it_dependent (a person works from a system report).
#   frequency      event (each time it happens), daily, weekly, monthly, quarterly,
#                  semiannual or annual.
#   level          key, non-key, compensating or supporting, most important first (see levels.yaml):
#                    key           relied on to address the risk, tested by auditors
#                    non-key       matters, but is not relied on alone
#                    compensating  covers for a control that is missing or not working, usually for a limited time
#                    supporting    helps other controls work (documentation, baselines, tuning)
#   owned_by       Role accountable for the control.
#   performed_by   Role that does the work day to day.
#   reviewed_by    Role that checks the work (optional).
#   stage / theme  Where it sits in the topic: one stage, or one theme.
#   categories     Kinds of technology it applies to: application, database,
#                  operating_system, jobs, network, identity, cloud,
#                  engineering_tools or logging.
#   platforms      Optional. Platform names exactly as on the site. A name the
#                  site doesn't have is skipped with a warning.
#   criteria       What good looks like, in groups. Each group has:
#                    heading   what the group is about
#                    part      optional: configuration (set up correctly) or
#                              monitoring (checked on an ongoing basis)
#                    items     plain sentences. Write "text:" and "sox_only: true"
#                              for an item needed only for SOX in-scope apps.
#   steps          How to run it, in order. Each has:
#                    who       role doing the step
#                    do        what to do
#                    evidence  what to keep as proof
#                    part      optional: configuration or monitoring
#   references     Optional. A list of "label" and "link" (starting with https://).

topic: Designing your controls

risks:
  - title: A control relies on a report that is incomplete or wrong
    statement: >-
      A control works from a report or data extract that is missing records or holds wrong values, so the
      review or reconciliation looks complete when it is not. This can happen when the source and filters
      are not recorded, the output is never compared with the source, or the query is edited without
      review. The result could be that the problem the control exists to catch, such as an unmatched
      change or a failed job, never appears on the list.
    owned_by: Control owner
    theme: Reports and data used in controls
    in_sox_scope: yes
    covered_by:
      - control: report-accuracy
        coverage: full
        why: The source and parameters are documented, completeness and accuracy are checked each run, and query changes go through change control.

controls:
  - ref: report-accuracy
    title: Reports used in key controls are complete and accurate
    why: >-
      A control is only as good as the report it starts from. If the report leaves something out, the
      control never sees it. Checking each report when it is set up, each time it is run and after every
      change shows that the control works on the full picture. The guide "Reports used in controls"
      explains how.
    applies_when:
      - A control starts from a report, dashboard, query or data extract, such as a user list, a list of changes or a list of job runs.
    nature: detective
    method: manual
    frequency: event
    level: supporting
    owned_by: Application owner
    performed_by: Report owner
    reviewed_by: Control owner
    theme: Reports and data used in controls
    categories: [application, database, operating_system, network, identity, cloud, jobs, engineering_tools, logging]
    criteria:
      - heading: Where the report comes from
        part: configuration
        items:
          - The source system, table or feed, the query or report definition, every filter and parameter, and any exclusion with its reason are written down in one place. The system produces the report; nobody types or edits it by hand.
      - heading: Each time it runs
        part: monitoring
        items:
          - Completeness is checked by confirming that record counts or totals agree with the source, taken a different way from the report itself. Accuracy is checked by tracing a few rows back to the source record.
          - The raw export is saved unedited with the date, the time and the period it covers. Any difference is explained before the control relies on the report.
      - heading: When the report changes
        part: configuration
        items:
          - A change to the query, report or source goes through change control, with review by someone other than the author, and only a small named group can edit it.
          - The full completeness and accuracy checks are repeated after a change, before the next run relies on the report.
          - text: The report definition, its change history and the check results for every run are kept for the period in the firm's [records retention schedule](#todo-records-retention-schedule).
            sox_only: true
    steps:
      - who: Report owner
        do: Write down the source, the query, the filters and parameters, and any exclusion with its reason.
        evidence: The report description, with the date and the saved query
        part: configuration
      - who: Report owner
        do: Each time the control runs, compare counts or totals with the source, trace a few rows, and save the raw export.
        evidence: The export, the comparison result and notes on any difference
        part: monitoring
      - who: Report owner
        do: When the query or source changes, raise a change, have it reviewed, and repeat the full checks before the next run.
        evidence: The change record, its review and the repeated check results
        part: configuration
      - who: Control owner
        do: Confirm the checks were done for the runs in the period and sign off.
        evidence: The sign-off with the date
        part: monitoring

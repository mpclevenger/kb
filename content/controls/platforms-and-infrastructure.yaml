# Controls and risks for one topic. Plain text; edit with any text editor.
# After editing: python manage.py check_controls, then
# python manage.py sync_controls --user <you> --publish. See README.md in this folder.
# A control or risk is matched to the site by its title. Renaming a title makes a NEW item.
#
# FILE
#   topic          Name of the topic exactly as it appears on the site.
#   risks          What could go wrong. Each risk lists the controls that cover it.
#   controls       The controls themselves.
#
# RISK (each entry under "risks")
#   title          Short name of the risk.
#   statement      What could go wrong, why, and what it would lead to.
#   owned_by       Role accountable for the risk (a role, not a name).
#   stage          Lifecycle stage the risk belongs to. Use "theme" instead to
#                  place it under a theme. Never both.
#   in_sox_scope   yes or no. Is this a risk for SOX in-scope apps?
#   covered_by     Controls that reduce this risk. Each has:
#                    control   the short name ("ref") of a control in this file
#                    coverage  full or partial
#                    why       one line saying how the control helps
#
# CONTROL (each entry under "controls")
#   ref            Short name used only inside this file, so risks can point to it.
#                  The site gives the control its real ID (for example MC-01).
#   title          Name of the control.
#   why            Why the control exists, in two or three sentences.
#   applies_when   Plain statements. The control applies if any one is true.
#   nature         preventive (stops it happening) or detective (finds it afterward).
#   method         manual, automated, or it_dependent (a person works from a system report).
#   frequency      event (each time it happens), daily, weekly, monthly, quarterly,
#                  semiannual or annual.
#   level          key, non-key, compensating or supporting, most important first (see levels.yaml):
#                    key           relied on to address the risk, tested by auditors
#                    non-key       matters, but is not relied on alone
#                    compensating  covers for a control that is missing or not working, usually for a limited time
#                    supporting    helps other controls work (documentation, baselines, tuning)
#   owned_by       Role accountable for the control.
#   performed_by   Role that does the work day to day.
#   reviewed_by    Role that checks the work (optional).
#   stage / theme  Where it sits in the topic: one stage, or one theme.
#   categories     Kinds of technology it applies to: application, database,
#                  operating_system, jobs, network, identity, cloud,
#                  engineering_tools or logging.
#   platforms      Optional. Platform names exactly as on the site. A name the
#                  site doesn't have is skipped with a warning.
#   criteria       What good looks like, in groups. Each group has:
#                    heading   what the group is about
#                    part      optional: configuration (set up correctly) or
#                              monitoring (checked on an ongoing basis)
#                    items     plain sentences. Write "text:" and "sox_only: true"
#                              for an item needed only for SOX in-scope apps.
#   steps          How to run it, in order. Each has:

# Baseline controls cover Windows Server and SQL Server; Kubernetes is an example where a platform
# differs. Scheduled jobs and data transfers are in operations-and-jobs.yaml.
topic: Platforms and infrastructure

risks:
  - title: Servers are set up inconsistently or insecurely
    statement: >-
      A server, database instance or cluster is built or configured in a way that is weaker than intended.
      This can happen when there is no agreed baseline, or each build is done by hand. The result could be
      exposure to attack or unreliable behavior across the systems that run on it.
    owned_by: Head of Engineering
    stage: Configure and evidence
    in_sox_scope: yes
    covered_by:
      - control: config-baseline
        coverage: full
        why: A documented baseline defines the intended settings, and new servers are built to it.
      - control: drift-monitoring
        coverage: partial
        why: Finds servers that no longer match the baseline.

  - title: Configuration drifts away from the approved setup
    statement: >-
      Settings on a server, database instance or cluster change over time without an approved request.
      This can happen when administrators make direct changes and nothing compares the live settings to
      the baseline. The result could be weakened security or changed behavior, with no record of who changed
      what or why.
    owned_by: Head of Engineering
    stage: Monitor drift
    in_sox_scope: yes
    covered_by:
      - control: drift-monitoring
        coverage: full
        why: Live settings are compared to the baseline on a schedule, and each difference is approved or fixed.
      - control: config-baseline
        coverage: partial
        why: The baseline gives a clear definition of what should be set.

controls:
  - ref: config-baseline
    title: Servers are built to a documented baseline
    why: >-
      A written baseline says what a correctly set up server, database instance or cluster looks like.
      Without one, every build is a judgment call and nothing can be checked against it later.
    applies_when:
      - The team builds or manages Windows servers, SQL Server instances or similar platforms.
      - The team runs a directory, an engineering tool or a logging platform whose settings protect in-scope systems.
    nature: preventive
    method: manual
    frequency: annual
    level: supporting
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    stage: Configure and evidence
    categories: [operating_system, database, cloud, network, identity, engineering_tools, logging]
    criteria:
      - heading: The baseline
        part: configuration
        items:
          - A written baseline exists for each kind of server or platform, covering security settings, services, accounts, logging and patch level.
          - It is based on vendor guidance and adjusted to the firm's needs, and the reasons for any difference are recorded.
          - Kubernetes clusters, directories, engineering tools and logging platforms have a baseline in the same way, covering the settings that protect the systems that rely on them.
          - The baseline is reviewed at least once a year and when the platform changes.
      - heading: Building to it
        part: configuration
        items:
          - New servers are built from the baseline using a template or automation, not by hand from memory.
          - Any difference from the baseline at build time is approved and recorded.
          - text: The baseline versions and the evidence that each in-scope server was built to it are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Platform engineer
        do: Write down the intended settings for each kind of server or platform, and the reasons for any departure from vendor guidance.
        evidence: The baseline document with its date and version
        part: configuration
      - who: Platform engineer
        do: Build servers from the template, and record any approved difference.
        evidence: The build record or template version used
        part: configuration
      - who: Control owner
        do: Review the baseline each year and sign off.
        evidence: The sign-off with the date

  - ref: drift-monitoring
    title: Configuration drift is monitored
    why: >-
      Servers change after they are built. Comparing live settings to the baseline on a schedule finds
      unapproved changes and weakened settings before they cause harm or hide a different problem.
    applies_when:
      - The team runs servers, database instances or clusters whose settings could affect security or data.
      - The team runs a directory, an engineering tool or a logging platform whose settings protect in-scope systems.
    nature: detective
    method: it_dependent
    frequency: monthly
    level: non-key
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    stage: Monitor drift
    categories: [operating_system, database, cloud, network, identity, engineering_tools, logging]
    criteria:
      - heading: Checking against the baseline
        part: monitoring
        items:
          - Live settings are compared to the baseline on the schedule set in your team's written procedure, by a tool where possible.
          - The comparison covers every in-scope server, instance, cluster and platform, and the list of what is covered is kept complete.
          - Changes to important settings, such as administrator group membership, can raise an alert between checks.
      - heading: Dealing with differences
        part: monitoring
        items:
          - Each difference is either matched to an approved change and the baseline updated, or fixed.
          - Unexplained differences are investigated and the outcome recorded.
          - text: The comparison results and the follow-up are kept for the period in the firm's records retention schedule.
            sox_only: true
    steps:
      - who: Platform engineer
        do: Run the comparison against the baseline for every in-scope server, instance, cluster and platform.
        evidence: The comparison output with the date and what it covered
        part: monitoring
      - who: Platform engineer
        do: Match each difference to an approved change or fix it, and record which.
        evidence: Tickets or notes for each difference
        part: monitoring
      - who: Control owner
        do: Review the results and follow-up, and sign off.
        evidence: The sign-off with the date
        part: monitoring

<div id="library">
  <ul class="library-sections">
    {% for c in cards %}
    <li>
      <a class="library-section library-section-{{ c.key }}{% if c.active %} library-section-active{% endif %}"
         href="{% if c.active %}{% url 'wiki:index' %}{% else %}{% url 'wiki:index' %}?section={{ c.key }}{% endif %}"
         hx-get="{% if c.active %}{% url 'wiki:index' %}{% else %}{% url 'wiki:index' %}?section={{ c.key }}{% endif %}"
         hx-target="#library" hx-swap="outerHTML" hx-push-url="true"
         {% if c.active %}aria-current="true"{% endif %}>
        <span class="library-section-title">{{ c.label }}</span>
        <span class="library-section-hint">{{ c.hint }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  <div aria-live="polite">
    {% if rows %}
      {% include "wiki/_rows.html" %}
    {% else %}
      <p class="library-none">Nothing published here yet.</p>
    {% endif %}
  </div>
</div>

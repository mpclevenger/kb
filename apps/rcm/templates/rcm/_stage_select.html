<select id="stage" name="stage" class="form-select form-select-sm"{% if oob %} hx-swap-oob="true"{% endif %}{% if not stage_options %} disabled{% endif %} aria-label="Stage">
  <option value="">{% if stage_options %}All stages{% else %}Pick a topic first{% endif %}</option>
  {% for s in stage_options %}<option value="{{ s.pk }}"{% if f.stage.pk == s.pk %} selected{% endif %}>{{ s.name }}</option>{% endfor %}
</select>
